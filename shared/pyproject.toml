[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "songscribe-shared"
version = "0.1.0"
description = "Shared config, ORM models, storage backends, and event publishing for SongScribe."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "boto3>=1.34",
    "redis>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["songscribe_shared*"]
